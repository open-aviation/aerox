- id: easa_a064_issue_63
  title: EASA Type Certificate Data Sheet EASA.A.064, Issue 63
  organization: European Union Aviation Safety Agency
  url: https://www.easa.europa.eu/en/document-library/type-certificates/aircraft-cs-25-cs-22-cs-23-cs-vla-cs-lsa/easaa064-airbus-a318-a319-a320-a321-single-aisle
  direct_document_url: https://www.easa.europa.eu/en/downloads/16507/en
  issue: 63
  issue_date: 2026-11-24
  accessed: 2026-11-24
  relevant_pages: Section 1 (A320) items 10, 11, 13 and 16 (pp. 45-48); Section 2 (A321) pp. 99-103;
    Section 3 (A319) pp. 149-153; Section 4 (A318) pp. 172-175
  evidence_type: certified-published
  aircraft:
    model: Airbus A320-214
    type_design_definition: AI/EA-S 413.0150/95 (00D000A0006/C21)
    engines:
    - CFM56-5B4
    - CFM56-5B4/2
  license: EASA-copyright
  notes:
  - Supplies maximum certified masses, principal external dimensions, datum, and 4.1935 m
    mean aerodynamic chord for the A320 series.
  - Maximum A320-214/-232/-233 masses are 78,000 kg takeoff, 66,000 kg landing, and 62,500
    kg zero fuel; minimum weight is 37,230 kg.
  - Configuration-specific mass limitations depend on the applicable AFM weight variant.
  - Altitude extensions depend on modifications.
  - The CG range is not printed and is referred to the approved AFM.
  - It does not publish the tail/control planforms or inertia tensor needed by the proposed
    lateral-directional model.
- id: airbus_a320_acap_2026_07
  title: A320 Aircraft Characteristics - Airport and Maintenance Planning
  organization: Airbus
  url: https://www.aircraft.airbus.com/en/customer-care/fleet-wide-care/airport-operations-and-aircraft-characteristics/aircraft-characteristics
  revision: 46
  revision_date: 2026-07-01
  accessed: 2026-08-05
  evidence_type: manufacturer-published-planning
  aircraft:
    family: Airbus A320
  license: Airbus-copyright
  notes:
  - Independently supports the 37.57 m length, 34.10 m wing-tip-fence span, 35.80 m sharklet
    span, 12.45 m horizontal-stabilizer span, and other external dimensions.
  - The drawings expose a 5.87 m vertical-tail height above the horizontal- stabilizer reference
    and use 26.5 percent MAC as a planning-reference CG in ground-clearance configurations.
  - The reference CG is not an operational measurement or certified flight envelope, and the
    document does not supply complete aerodynamic tail/ control geometry or an inertia tensor.
