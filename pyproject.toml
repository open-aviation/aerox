[project]
name = "aerox"
version = "0.1.0"
description = "Aircraft performance data library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.16.3",
]

[project.optional-dependencies]
editor = [
    "flask>=3.1.2",
]
research = [
    "fastmeteo>=1.1.1,<2",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pytest>=9.0.1",
    "ruff>=0.12.0",
    "scipy>=1.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aerox = [
    "data/aircraft/*.csv",
    "data/aircraft/yml/*/*.yml",
    "data/aircraft/sources/*/*.txt",
    "data/engines/*.csv",
    "data/engines/*.xlsx",
    "data/engines/*.txt",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
norecursedirs = [
    "old",
    ".venv",
    "docs",
    "agent-modeling",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
