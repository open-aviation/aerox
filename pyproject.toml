[project]
name = "aerox"
version = "0.4"
description = "Aircraft data and performance models built from open sources, successor to OpenAP"
authors = [{ name = "Junzi Sun", email = "git@junzis.com" }]
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["aircraft performance", "drag polar", "aircraft data", "aviation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.16.3",
]

[project.scripts]
aerox = "aerox.cli:main"

[project.optional-dependencies]
editor = [
    "flask>=3.1.2",
]
plot = [
    "matplotlib>=3.10.7",
]
research = [
    "fastmeteo>=1.1.1,<2",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pytest>=9.0.1",
    "ruff>=0.12.0",
    "scipy>=1.16.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Keep the aligned comments in the documentation examples.
exclude = ["*.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerox"]

[tool.hatch.build.targets.sdist]
include = ["src/aerox", "test", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
norecursedirs = [
    "old",
    ".venv",
    "docs",
    "agent-modeling",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
